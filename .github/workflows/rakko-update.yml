---
name: Rakko

# An update of Rakko can change the tools that the mounted actions declare.
# Rakko then stops every command except the help and `doctor` until
# `doctor --fix` writes the tool pins again. In a pull request of Renovate,
# the action runs that update and commits the new tool pins to its branch.

"on":
  pull_request:

permissions: {}

concurrency:
  group: rakko-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    name: Update the tool pins
    runs-on: ubuntu-latest

    permissions:
      contents: write # The action pushes the new tool pins to the branch.

    steps:
      - name: Update the tool pins
        uses: aonyx-ai/rakko-update@03c23eabfb828d7c35c4de2ea341575905d2b14a # main
