[workspace]
members = ["crates/*"]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"

license = "MIT or Apache-2.0"
repository = "https://github.com/aonyx-ai/kawauso.git"

# Rust edition 2024 requires Rust 1.85 or later
rust-version = "1.85.0"

[workspace.dependencies]
dirs = ">=4.0.0, <7"
indoc = "2.0.0"
serde = { version = "1.0.225", features = ["derive"] }
serde_path_to_error = ">=0.1.0, <1"
tempfile = "3.0.0"
thiserror = "2.0.0"
toml = "1.0.0"
typed-fields = ">=0.7.0, <1"

[workspace.lints.clippy]
# Require documentation on private items as well, since that helps with long-term maintainability.
missing_docs_in_private_items = "warn"

# Require errors, panics, and unsafe code to be documented.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unnecessary_safety_doc = "warn"

# `unwrap` and `expect` can cause panics, which is why we ban them from production code. Tests are
# exempt, which `.clippy.toml` configures.
expect_used = "warn"
unwrap_used = "warn"

# Forbid printing anything to stdout or stderr.
print_stderr = "warn"
print_stdout = "warn"

# Prefer `mod.rs` over `name.rs` so that every module is a self-contained unit.
self_named_module_files = "warn"

[workspace.lints.rust]
# Detect explicit lifetime requirements that the compiler can infer.
explicit_outlives_requirements = "forbid"

# Types must implement or derive `Debug` so that they can be easily debugged.
missing_debug_implementations = "forbid"

# Require documentation for all public items
missing_docs = "forbid"

# Public but unreachable items are likely a mistake.
unreachable_pub = "forbid"

# Unsafe code can lead to undefined behavior and security vulnerabilities.
unsafe_code = "forbid"
