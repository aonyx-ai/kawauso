[package]
name = "kawauso-process"
description = "External programs for Kawauso applications"

version = "0.0.0"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

documentation = "https://docs.rs/kawauso-process"
readme = "README.md"

categories = ["asynchronous", "development-tools"]
keywords = ["process", "command", "subprocess"]

include = [
  "CHANGELOG.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "src/**/*.rs",
  "tests/*.rs",
]

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
typed-fields = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
